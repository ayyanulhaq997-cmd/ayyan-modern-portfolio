
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Request Received | Ayyan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: #0b1020;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 42px 30px;
      text-align: center;
      background: #131b30;
      border: 1px solid #293650;
      border-radius: 24px;
    }
    .check {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #183c39;
      color: #6ee7b7;
      font-size: 34px;
    }
    h1 { font-size: clamp(28px, 6vw, 38px); }
    p { color: #bdc7dc; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank you for your enquiry!</h1>
    <p>Your website project request has been submitted. Thank you for considering me for your project.</p>
    <p>I'll review your requirements and get back to you using the email address you provided.</p>
    <a href="/">Return to my portfolio</a>
  </main>
</body>
</html>
